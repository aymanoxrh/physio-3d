<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="physioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Medical Grid Accent -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- Stylized Anatomical Head & Torso -->
  <g filter="url(#glow)">
    <!-- Head / Cranium -->
    <circle cx="64" cy="32" r="10.5" fill="url(#physioGrad)"/>

    <!-- Spine / Core Line -->
    <line x1="64" y1="45" x2="64" y2="86" stroke="url(#physioGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Pectoral & Shoulder Arcs -->
    <path d="M 40 50 C 50 44, 78 44, 88 50 C 93 54, 88 64, 82 66 C 74 68, 68 64, 64 68 C 60 64, 54 68, 46 66 C 40 64, 35 54, 40 50 Z" 
          fill="none" stroke="url(#physioGrad)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Lat / Ribcage Contours -->
    <path d="M 48 70 C 54 75, 74 75, 80 70" fill="none" stroke="url(#physioGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 52 79 C 56 83, 72 83, 76 79" fill="none" stroke="url(#physioGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Pelvic / Base V -->
    <path d="M 50 92 L 64 102 L 78 92" fill="none" stroke="url(#physioGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Pulse / Vitality Wave -->
    <path d="M 28 66 L 38 66 L 43 57 L 49 75 L 55 63 L 60 66 L 68 66" 
          fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Modern "3D" Badge -->
  <g transform="translate(82, 88)">
    <rect width="32" height="18" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="13" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">3D</text>
  </g>
</svg>
